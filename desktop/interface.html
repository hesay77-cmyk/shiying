<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'nonce-__NONCE__'; img-src data:"><title>Ruxget</title><style>__PLUGIN_CSS__</style><style>__DESKTOP_CSS__</style></head>
<body class="desktop-app">
<div id="fullSurface">
  <header class="topbar desktop-toolbar">
    <div class="brand"><img src="__ICON__" alt="" width="25" height="25" draggable="false"><h1>Ruxget</h1></div>
    <form id="addLink"><div class="link-input"><span aria-hidden="true">＋</span><input id="linkURL" aria-label="下载链接" data-i18n-aria="linkAria" data-i18n-placeholder="linkPlaceholder" placeholder="粘贴视频、文件或磁力链接" maxlength="16384" required><button type="submit" data-i18n="add">添加</button></div></form>
    <button id="chooseFolder" class="folder-chip" title="选择默认保存文件夹" data-i18n-title="chooseFolderTitle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7V5a1 1 0 0 1 1-1h5l2 3h9a1 1 0 0 1 1 1v11H3Z"/></svg><span id="folderLabel" data-i18n="saveToDownloads">保存到下载文件夹</span></button>
    <div class="topbar-actions"><button id="miniToggle" class="floating-toggle" data-i18n="miniWindow">迷你窗</button><details class="menu"><summary aria-label="打开设置" data-i18n-aria="openMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg></summary><div class="menu-panel"><button data-command="new" data-i18n="newDownload">新建下载</button><button data-command="batch" data-i18n="batchAdd">批量添加</button><button data-command="torrent" data-i18n="importTorrent">导入 BT 种子</button><button data-command="settings" data-i18n="downloadSettings">下载设置</button><button data-command="components" data-i18n="videoComponents">视频组件</button><button data-command="connection" data-i18n="connectChrome">连接 Chrome 插件</button><button data-command="about" data-i18n="aboutRuxget">关于Ruxget</button><button data-command="hide" data-i18n="hideToTray">收起到托盘</button></div></details><button type="button" id="languageSelect" class="floating-toggle language-switch" aria-label="Language" title="A=跟随系统 · 中=中文 · EN=English" data-lang="auto">A</button></div>
    <div class="window-controls" role="group" aria-label="窗口操作" data-i18n-aria="windowOps"><button data-window="minimize" aria-label="最小化" data-i18n-aria="minimize" data-i18n-title="minimize" title="最小化"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button><button data-window="maximize" aria-label="最大化或还原" data-i18n-aria="maximize" data-i18n-title="maximize" title="最大化或还原"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx=".5"/></svg></button><button data-window="close" aria-label="关闭Ruxget" data-i18n-aria="closeApp" data-i18n-title="closeApp" title="关闭Ruxget"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button></div>
  </header>
  <div class="workspace">
    <main id="queuePane">
      <div class="queue-toolbar"><div class="list-heading"><h2><span data-i18n="downloads">下载</span> <span id="count">0</span></h2></div><div class="filters"><div class="segments" role="group" aria-label="任务状态" data-i18n-aria="taskStatus"><button data-filter="all" class="active" aria-pressed="true" data-i18n="filterAll">全部</button><button data-filter="active" aria-pressed="false" data-i18n="filterActive">进行中</button><button data-filter="complete" aria-pressed="false" data-i18n="filterComplete">已完成</button><button data-filter="unfinished" aria-pressed="false" data-i18n="filterUnfinished">未完成</button></div></div><span id="activeCount" class="quality-note"></span></div>
      <div id="batchTools" hidden><span id="selectionCount"></span><button class="text-button" data-batch="pause" data-i18n="pause">暂停</button><button class="text-button" data-batch="resume" data-i18n="resume">继续</button><button class="text-button" data-batch="forget" data-i18n="deleteTask">删除任务</button></div>
      <div class="queue-scroll"><div id="empty" class="empty"><div class="empty-symbol" aria-hidden="true">↓</div><h3 data-i18n="emptyTitle">添加一个下载链接</h3><p data-i18n="emptyBody">粘贴或拖入下载链接，也可以拖入 BT 种子。</p><div class="empty-actions"><button data-command="new" class="download-button" data-i18n="newDownload">新建下载</button><button data-command="torrent" class="text-button" data-i18n="importTorrent">导入 BT 种子</button></div></div><div id="taskList" class="media-list" aria-label="下载任务列表" data-i18n-aria="taskList"></div></div>
    </main>
    <aside id="inspector" aria-label="下载详情面板" data-i18n-aria="inspectorPanel" hidden><div class="inspector-heading"><h2 data-i18n="downloadDetails">下载详情</h2><button id="closeInspector" class="icon-button" aria-label="收起下载详情" data-i18n-aria="collapseDetails" data-i18n-title="collapseDetails" title="收起详情"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></div><div id="inspectorBody"></div><div id="inspectorActions" class="inspector-actions"></div></aside>
  </div>
  <footer><span data-i18n="freeOpenSource">免费开源，无广告</span><button class="text-button" data-command="batch" data-i18n="batchAdd">批量添加</button></footer>
</div>
<section id="miniSurface" hidden><div class="mini-heading"><span id="miniCount">Ruxget</span><button id="expand" class="text-button" data-i18n="expand">展开 ↗</button><div class="window-controls" role="group" aria-label="窗口操作" data-i18n-aria="windowOps"><button data-window="minimize" aria-label="最小化" data-i18n-aria="minimize" data-i18n-title="minimize" title="最小化"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5h10"/></svg></button><button data-window="close" aria-label="关闭Ruxget" data-i18n-aria="closeApp" data-i18n-title="closeApp" title="关闭Ruxget"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m3.5 3.5 9 9m0-9-9 9"/></svg></button></div></div><h2 id="miniTitle"></h2><section class="job-capsule"><div class="job-line"><span id="miniStage"></span><b id="miniPercent"></b></div><progress id="miniProgress" max="100" value="0"></progress></section><div class="job-actions"><button id="miniHide" class="text-button" data-i18n="collapse">收起</button><button id="miniDelete" class="text-button task-delete" title="删除任务并选择是否保留文件" data-i18n-title="deleteTaskKeepHint" data-i18n="deleteTask" hidden>删除任务</button><button id="miniNext" class="text-button" data-i18n="nextItem">下一项</button><button id="miniAction" class="download-button" data-i18n="pause">暂停</button></div></section>
<dialog id="editor" class="sheet"><form id="editorForm"><div class="sheet-heading"><h2 id="editorTitle" data-i18n="newDownload">新建下载</h2><button type="button" class="text-button" data-close data-i18n="cancel">取消</button></div><label><span data-i18n="downloadLink">下载链接</span><input id="editorURL" required maxlength="16384"></label><section class="video-choice"><select id="editorKind" aria-label="下载类型" data-i18n-aria="downloadType"><option value="file" data-i18n="kindFile">普通文件</option><option value="video" data-i18n="kindVideo">网页视频</option><option value="audio" data-i18n="kindAudio">MP3 音频</option><option value="magnet" data-i18n="kindMagnet">磁力链接</option><option value="torrent" data-i18n="kindTorrent">BT 种子</option></select><select id="editorHeight" aria-label="最高画质" data-i18n-aria="maxQuality"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">2160p</option><option value="4320">4320p</option></select></section><div class="save-location"><span id="editorFolder"></span><button type="button" class="text-button" id="pickEditorFolder" data-i18n="chooseFolderEllipsis">选择文件夹…</button></div><label class="check-line"><input id="editorCategorize" type="checkbox"><span data-i18n="categorizeByType">按类型放入子文件夹</span></label><p id="editorNote" class="quality-note"></p><button id="confirmAdd" class="download-button" type="submit" data-i18n="startDownload">开始下载</button></form></dialog>
<dialog id="batchEditor" class="sheet"><form id="batchForm"><div class="sheet-heading"><h2 data-i18n="batchAdd">批量添加</h2><button type="button" class="text-button" data-close data-i18n="cancel">取消</button></div><label><span data-i18n="batchUrlsLabel">每行一个链接，最多 100 条</span><textarea id="batchURLs" rows="6" required maxlength="2097152"></textarea></label><section class="video-choice"><select id="batchKind" aria-label="批量下载类型" data-i18n-aria="batchType"><option value="file" data-i18n="kindFileOrMagnet">文件 / 磁力链接</option><option value="video" data-i18n="kindVideo">网页视频</option><option value="audio" data-i18n="kindAudio">MP3 音频</option></select><select id="batchHeight" aria-label="批量最高画质" data-i18n-aria="batchMaxQuality"><option value="720">720p</option><option value="1080" selected>1080p</option><option value="2160">2160p</option></select></section><div class="save-location"><span id="batchFolder"></span><button type="button" class="text-button" id="pickBatchFolder" data-i18n="chooseFolderEllipsis">选择文件夹…</button></div><label class="check-line"><input id="batchCategorize" type="checkbox"><span data-i18n="categorizeByType">按类型放入子文件夹</span></label><button class="download-button" type="submit" data-i18n="addToQueue">添加到队列</button></form></dialog>
<dialog id="settings" class="sheet"><form id="settingsForm"><div class="sheet-heading"><h2 data-i18n="downloadSettings">下载设置</h2><button type="button" class="text-button" data-close data-i18n="cancel">取消</button></div><label><span data-i18n="uiLanguage">界面语言</span><select id="settingsLanguage" aria-label="Language"><option value="auto" data-i18n="langAuto">跟随系统</option><option value="zh_CN" data-i18n="langZh">中文</option><option value="en" data-i18n="langEn">English</option></select></label><label><span data-i18n="proxyLabel">网页 / HTTP Tracker 代理</span><input name="Proxy" placeholder="不使用代理时留空" data-i18n-placeholder="proxyPlaceholder"></label><div class="settings-grid"><label><span data-i18n="connections">每个文件连接数</span><input name="Connections" type="number" min="1" max="16" required></label><label><span data-i18n="fileSlots">文件并行任务</span><input name="FileSlots" type="number" min="1" max="4" required></label><label><span data-i18n="videoSlots">视频并行任务</span><input name="VideoSlots" type="number" min="1" max="2" required></label><label><span data-i18n="rateLimit">限速 KiB/s</span><input name="RateKiB" type="number" min="0" max="102400" required></label><label><span data-i18n="btUpload">BT 上传 KiB/s</span><input name="BtUploadKiB" type="number" min="16" max="8192" required></label></div><label class="check-line"><input name="AutoCategorize" type="checkbox"><span data-i18n="autoCategorize">新任务默认按类型归档</span></label><p class="quality-note" data-i18n="settingsNote">限速为 0 表示不限；BT 节点直接联网。默认保存位置可在主界面上方修改。</p><button class="download-button" type="submit" data-i18n="save">保存</button></form></dialog>
<dialog id="btChooser" class="sheet"><form id="btForm"><div class="sheet-heading"><h2 data-i18n="chooseFiles">选择下载文件</h2><button type="button" class="text-button" data-close data-i18n="chooseLater">稍后选择</button></div><p id="btTitle" class="quality-note"></p><div class="row-tools"><button type="button" id="btAll" class="text-button" data-i18n="selectAll">全选</button><button type="button" id="btNone" class="text-button" data-i18n="clearSelection">清空选择</button><span id="btSummary" class="quality-note"></span></div><div id="btFiles"></div><p class="quality-note" data-i18n="btNote">未确认前不开始下载。跨文件校验可能保留少量未选文件的边界数据。</p><button id="btStart" class="download-button" type="submit" disabled data-i18n="downloadSelected">下载所选文件</button></form></dialog>
<dialog id="deleteDialog" class="sheet" aria-labelledby="deleteTitle" aria-describedby="deleteName deleteNote"><form id="deleteForm"><div class="sheet-heading"><h2 id="deleteTitle" data-i18n="deleteThisTask">删除这个任务？</h2></div><p id="deleteName" class="quality-note"></p><label class="check-line"><input id="deleteFiles" type="checkbox" checked><span data-i18n="alsoDeleteFiles">同时删除文件</span></label><p id="deleteNote" class="quality-note"></p><div class="delete-actions"><button id="deleteCancel" type="button" class="text-button" data-close data-i18n="cancel">取消</button><button id="deleteConfirm" class="download-button" type="submit" data-i18n="deleteTaskAndFiles">删除任务和文件</button></div></form></dialog>
<dialog id="info" class="sheet"><div class="sheet-heading"><h2 id="infoTitle"></h2><button type="button" class="text-button" data-close data-i18n="close">关闭</button></div><div id="infoContent"></div></dialog>
<div id="taskMenu" class="menu-panel" hidden></div><div id="toast" class="toast" role="status" hidden></div>
<div class="resize-edge resize-left" data-resize="10" aria-hidden="true"></div>
<div class="resize-edge resize-right" data-resize="11" aria-hidden="true"></div>
<div class="resize-edge resize-top" data-resize="12" aria-hidden="true"></div>
<div class="resize-edge resize-bottom" data-resize="15" aria-hidden="true"></div>
<div class="resize-edge resize-top-left" data-resize="13" aria-hidden="true"></div>
<div class="resize-edge resize-top-right" data-resize="14" aria-hidden="true"></div>
<div class="resize-edge resize-bottom-left" data-resize="16" aria-hidden="true"></div>
<div class="resize-edge resize-bottom-right" data-resize="17" aria-hidden="true"></div>
<div id="dropHint" role="status" hidden data-i18n="dropHint">松开添加种子或链接</div>
<script nonce="__NONCE__">__DESKTOP_JS__</script></body></html>
