<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>catCatch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/public.css" media="all" />
  <link rel="stylesheet" type="text/css" href="css/popup.css" media="all" />
<script src="js/shiying-takeover.js"></script>
  <script src="lib/jquery.min.js"></script>
  <script src="js/ruxget-locale-data.js"></script>
  <script src="js/polyfill.js"></script>
  <script src="js/init.js"></script>
  <script src="js/function.js"></script>
  <script src="js/templates.js"></script>
  <link rel="stylesheet" href="css/shiying-tools.css">
</head>

<body class="popupBody">
  <div class="Tabs">
    <div id="currentTab" class="TabButton flex Active" title="Current Page" data-i18n-title="tipCurrentPage">
      <span data-i18n-outer="currentPage"></span>
      <div id="quantity"></div>
    </div>
    <div id="allTab" class="TabButton flex" title="Other Pages" data-i18n-title="tipOtherPages">
      <span data-i18n-outer="otherPage"></span>
      <div id="quantity"></div>
    </div>
    <div id="otherTab" class="TabButton" title="Other Features / Media Control" data-i18n-title="tipOtherFeatures">
      <!-- <i18n>otherFeatures</i18n> / -->
      <i18n>mediaControl</i18n> /
      <i18n>settings</i18n>
    </div>
    <div id="maybeKeyTab" class="TabButton hide" title="Possible Key" data-i18n-title="tipPossibleKey">
      <span data-i18n-outer="possibleKey"></span>
    </div>
  </div>
  <div id="Tips" data-i18n="loadingData">
  </div>
  <div id="TipsFixed">~</div>
  <div id="mediaList" class="container hide TabShow"></div>
  <div id="allMediaList" class="container hide"></div>
  <div id="otherOptions" class="container hide">
    <div class="otherTips" data-i18n="mediaControl"></div>
    <div class="flexRow">
      <b class="nowrap" data-i18n="selectWebpage"></b>
      <select id="videoTabIndex" title="Video Tab" data-i18n-title="tipVideoTab">
        <option value="-1" id="videoTabTips" data-i18n="noMediaDetected"></option>
      </select>
    </div>
    <div class="flexRow">
      <b class="nowrap" data-i18n="selectMedia"></b>
      <select id="videoIndex" title="Video" data-i18n-title="tipVideo">
        <option value="-1" id="videoIndexTips" data-i18n="noControllableMediaDetected"></option>
      </select>
    </div>
    <div id="PlayControl" class="textColor">
      <span data-i18n-outer="multiplier"></span><input id="playbackRate" type="number" value="2" min="0.1" max="16"
        title="Play Back Rate" data-i18n-title="tipPlaybackRate" step="1" />
      <button id="speed" class="button2" data-i18n="speedPlayback" title="Adjust playback speed" data-i18n-title="tipSpeed"></button>
      <button id="control" data-switch="play" data-i18n="play" title="Play/Pause media" data-i18n-title="tipPlayPause"></button>
      <button id="pip" class="firefoxHide" data-i18n="pictureInPicture" title="Toggle picture-in-picture mode" data-i18n-title="tipPip"></button>
      <button id="fullScreen" class="firefoxHide" data-i18n="fullscreen" title="Toggle fullscreen mode" data-i18n-title="tipFullscreen"></button>
      <button id="screenshot" data-switch="play" data-i18n="screenshot"
        title="Take screenshot of current frame" data-i18n-title="tipScreenshot"></button>
      <label class="flexColumn loop" title="Loop" data-i18n-title="tipLoop">
        <div data-i18n="loop"></div><input type="checkbox" id="loop" placeholder="Loop">
      </label>
      <label class="flexColumn muted" title="Mute" data-i18n-title="tipMute">
        <div data-i18n="mute"></div><input type="checkbox" id="muted" placeholder="Mute">
      </label>
      <div class="flexColumn">
        <div data-i18n="volume" title="Volume" data-i18n-title="tipVolume"></div><input type="range" id="volume" class="volume" min="0" max="1"
          value="1" step="0.01" title="Volume Control" data-i18n-title="tipVolumeControl" />
      </div>
      <div class="flexColumn width100">
        <div id="timeShow" title="Time" data-i18n-title="tipTime"></div><input type="range" id="time" class="width100" min="0" max="100" value="0"
          step="1" title="Time Control" data-i18n-title="tipTimeControl" />
      </div>
    </div>
    <div class="line"></div>
    <div class="otherTips" data-i18n="functionEntry"></div>
    <div class="otherFeat flexRow">
      <button go="downloader.html" class="button2" data-i18n="downloader" title="Downloader" data-i18n-title="tipDownloader"></button>
      <button go="m3u8.html" class="button2" data-i18n="m3u8Parser" title="M3U8 Parser" data-i18n-title="tipM3u8Parser"></button>
      <button go="mpd.html" class="button2" data-i18n="mpdParser" title="MPD Parser" data-i18n-title="tipMpdParser"></button>
      <button go="json.html" class="button2" data-i18n="jsonFormatter" title="JSON Formatter" data-i18n-title="tipJsonFormatter"></button>
      <button go="ffmpegURL" class="button2" title="FFmpeg">FFmpeg</button>
      <button go="options.html" class="button2" data-i18n="settings" title="Open settings" data-i18n-title="tipOpenSettings"></button>
    </div>
  </div>
  <div id="maybeKey" class="container hide">
    <button id="maybeKeyCopy" data-i18n="copy" title="Copy" data-i18n-title="copy" class="button2"></button>
  </div>
  <div id="filter" class="more">
    <span id="regular" class="width100 regular">
      <input type="text" data-i18n-placeholder="regularFilterPlaceholder" title="Regular Filter" data-i18n-title="tipRegexFilter" id="regularText" />
      <button id="filter-duplicateFilenames" class="button2" data-i18n="deleteDuplicateFilenames"
        title="Delete Duplicate Filenames" data-i18n-title="deleteDuplicateFilenames"></button>
    </span>
    <div id="ext" title="Extensions" data-i18n-title="tipExtensions"></div>
  </div>
  <div id="features" class="more flex-end">
    <button id="unfoldAll" data-i18n="expandAll" title="Expand All" data-i18n-title="tipExpandAll" class="hide"></button>
    <button id="unfoldPlay" data-i18n="expandPlayable" title="Expand Playable" data-i18n-title="tipExpandPlayable" class="hide"></button>
    <button id="unfoldFilter" data-i18n="expandSelected" title="Expand Selected" data-i18n-title="tipExpandSelected" class="hide"></button>
    <button id="fold" data-i18n="collapseAll" title="Collapse All" data-i18n-title="tipCollapseAll" class="hide"></button>
    <button id="features-duplicateFilenames" class="button2 hide" data-i18n="deleteDuplicateFilenames"
      title="Delete Duplicate Filenames" data-i18n-title="deleteDuplicateFilenames"></button>
    <button id="recorder" class="button2 hide firefoxHideScript" type="script" data-i18n="videoRecording"
      title="Start video recording" data-i18n-title="tipRecordVideo"></button>
    <button id="webrtc" class="button2 hide firefoxHideScript" type="script" data-i18n="recordWebRTC"
      title="Record WebRTC streams" data-i18n-title="tipRecordWebRTC"></button>
    <button id="recorder2" class="button2 hide" type="script" data-i18n="screenCapture"
      title="Capture screen content" data-i18n-title="tipRecordScreen"></button>
    <button id="MobileUserAgent" class="button2 firefoxHideScript" data-i18n="simulateMobile"
      title="Simulate mobile device" data-i18n-title="tipMobile"></button>
    <button id="AutoDown" class="button2" data-i18n="autoDownload" title="Enable automatic downloads" data-i18n-title="tipAutoDownload"></button>
    <button id="send2localSelect" class="button2" data-i18n="send2local"
      title="Send selected items to local storage" data-i18n-title="tipSend2local"></button>
  </div>
  <div id="down">
    <button id="mergeDown" class="button2" data-i18n="onlineMerge" disabled
      title="Merge selected items for download" data-i18n-title="tipMergeDownload"></button>
    <button id="DownFile" data-i18n="download" title="Download selected items" data-i18n-title="tipDownloadSelected"></button>
    <button id="AllCopy" data-i18n="copy" title="Copy selected items to clipboard" data-i18n-title="tipCopySelected"></button>
    <button id="AllSelect" data-i18n="selectAll" class="hide" title="Select all items" data-i18n-title="tipSelectAll"></button>
    <button id="invertSelection" data-i18n="invertSelection" title="Invert selection" data-i18n-title="invertSelection"></button>
    <button id="openFilter" panel="filter" data-i18n="filter" title="Open filter options" data-i18n-title="tipFilter"></button>
    <button id="Clear" data-i18n="clear" title="Clear all items" data-i18n-title="tipClear"></button>
    <button id="search" class="button2 hide firefoxHideScript" type="script" data-i18n="deepSearch"
      title="Perform deep search" data-i18n-title="tipDeepSearch"></button>
    <button id="catch" class="button2 hide firefoxHideScript" type="script" data-i18n="cacheCapture"
      title="Capture cached content" data-i18n-title="tipCacheCapture"></button>
    <button id="more" class="button2" panel="features" data-i18n="moreFeatures" title="Show more features" data-i18n-title="moreFeatures"></button>
    <button id="enable" class="button2" data-i18n="pause" title="Pause/Resume capturing" data-i18n-title="tipPauseDetection"></button>
    <button id="Options" go="options.html" class="button2 hide" data-i18n="settings" title="Open settings" data-i18n-title="tipOpenSettings"></button>
    <button id="popup" class="button2" data-i18n="popup" title="Open in popup window" data-i18n-title="tipPopupWindow"></button>
    <button id="currentPage" class="hide" data-i18n="currentPage" title="Switch to current page" data-i18n-title="tipSwitchCurrent"></button>
  </div>
  <!-- 0.4.74: labels are translated before the large libraries load, so raw message keys are never painted. -->
  <script src="js/i18n.js"></script>
  <script src="lib/base64.js"></script>
  <script src="lib/mqtt.min.js"></script>
  <script src="js/popup-utils.js"></script>
  <script src="js/popup.js"></script>
  <script src="js/media-control.js"></script>
  <script src="lib/jquery.qrcode.min.js"></script>
  <script src="lib/hls.min.js"></script>
</body>

</html>
