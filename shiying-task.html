<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ruxget · Downloads</title><link rel="stylesheet" href="css/shiying.css"><link rel="stylesheet" href="css/shiying-task.css"><script src="js/shiying-locale.js"></script><script src="js/shiying-text.js"></script><script src="js/shiying-task.js" defer></script></head><body class="task-page">
<header class="brand task-header"><img src="img/shiying.svg" width="32" height="32" alt=""><div><h1>Ruxget</h1><span data-en="Downloads">下载管理</span></div></header>
<main><p id="taskLabel" class="eyebrow">下载进度</p><h2 id="taskTitle">正在读取下载进度…</h2><p id="taskMeta" class="task-meta"></p><div class="task-status"><span id="taskStage" role="status">正在准备</span><b id="taskPercent">0%</b></div><progress id="taskProgress" max="100" value="0" aria-label="下载进度" data-en-aria="Download progress"></progress><p id="taskNote" class="task-note">Chrome 会自动完成合并与保存。可以关掉小窗口或此页，请保持 Chrome 运行。</p><p id="taskError" class="error" role="alert" hidden></p><dl id="taskResult" hidden><dt id="resultLabel">画面</dt><dd id="resultVideo"></dd><dt data-en="Audio">声音</dt><dd id="resultAudio"></dd><dt data-en="Integrity">完整性</dt><dd id="resultIntegrity"></dd><dt data-en="Saved to">保存位置</dt><dd id="resultFile"></dd></dl><div class="task-actions"><button id="openFile" class="download-button" hidden data-en="Show in folder">在文件夹中显示</button><button id="cancelTask" class="secondary-button" data-en="Cancel download">取消下载</button><button id="reconnect" class="secondary-button" hidden data-en="Reconnect">重新连接</button></div><p class="task-foot" data-en="Free and open source, no ads. Files stay on your computer.">免费开源，无广告。文件保存在你的电脑上。</p></main></body></html>
